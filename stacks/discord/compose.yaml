services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: discord-bot:1.0
    container_name: discord-bot
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      DISCORD_BOT_NAME: ${DISCORD_BOT_NAME}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
    volumes:
      - discord-data:/DiscordBot/Data
      # L'entrypoint écrit tokens.yml dans data/ (minuscule).
      - discord-config:/DiscordBot/data

volumes:
  discord-data:
    name: discord-data
    labels:
      should.backup: "true"
  discord-config:
    name: discord-config
    labels:
      should.backup: "true"

# =============================================================================
# Stack Minecraft - Velocity + 8 serveurs Paper.
# Docs : https://docs.papermc.io/velocity/ et https://docs.papermc.io/paper/
# =============================================================================
# - velocity est le seul conteneur joignable par les joueurs (TCP 25565 et
#   ports Bedrock 19132/tcp, 19132/udp, 19133/udp) ;
# - les serveurs Paper ne sont accessibles que sur le réseau interne ;
# - mc-plugins télécharge les plugins officiels dans un volume partagé, puis
#   chaque serveur les recopie dans son propre dossier plugins ;
# - l'image Paper embarque les cartes de départ (stacks/minecraft/paper/maps)
#   et les extrait dans le volume du serveur au premier démarrage ;
# - le volume partagé mc-plugin-data est monté sur /plugin/DataFolder dans
#   chaque serveur Paper : le plugin maison y stocke les données communes
#   (argent, grades, tags, îles) ;
# - chaque serveur Paper reçoit son propre jeton Discord via DISCORD_BOT_TOKEN
#   et déduit son type (Hub, Survie…) de la variable SERVER_NAME.
# =============================================================================

# -----------------------------------------------------------------------------
# Ancre commune à tous les serveurs Paper (voir docs/services/minecraft.md).
# -----------------------------------------------------------------------------
x-paper: &paper
  image: paper
  build:
    context: ./paper
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    mc-plugins:
      condition: service_completed_successfully
  networks:
    - minecraft
    - egress
  environment: &paper-env
    TZ: ${TZ}
    PAPER_VERSION: ${PAPER_VERSION}
    PAPER_BUILD: ${PAPER_BUILD}
    # Variables exposées telles quelles au plugin (System.getenv).
    DOMAIN_NAME: ${DOMAIN_NAME}
    TLD: ${TLD}
    DOMAIN: ${DOMAIN_NAME}${TLD}
    VELOCITY_SECRET: ${VELOCITY_SECRET}
    VELOCITY_ONLINE_MODE: ${VELOCITY_ONLINE_MODE:-true}
    MINECRAFT_RCON_PASSWORD: ${MINECRAFT_RCON_PASSWORD}
    LEVEL_NAME: ${MINECRAFT_LEVEL_NAME}
    MAX_PLAYERS: ${MINECRAFT_MAX_PLAYERS}

services:
  # ---------------------------------------------------------------------------
  # Télécharge les plugins (plugin, ViaVersion, ViaBackwards, Geyser,
  # Floodgate) ainsi que WorldEdit pour le serveur créatif, puis s'arrête.
  # ---------------------------------------------------------------------------
  mc-plugins:
    build:
      context: ./plugins
      dockerfile: Dockerfile
    image: mc-plugins
    container_name: mc-plugins
    restart: "no"
    environment:
      TZ: ${TZ}
      PAPER_VERSION: ${PAPER_VERSION}
      PAPER_BUILD: ${PAPER_BUILD}
      PLUGIN_VERSION: ${PLUGIN_VERSION}
      VIAVERSION_VERSION: ${VIAVERSION_VERSION}
      VIABACKWARDS_VERSION: ${VIABACKWARDS_VERSION}
      WORLDEDIT_VERSION: ${WORLDEDIT_VERSION}
      WORLDEDIT_OPAQUE: ${WORLDEDIT_OPAQUE}
      GEYSER_VERSION: ${GEYSER_VERSION}
      FLOODGATE_VERSION: ${FLOODGATE_VERSION}
    volumes:
      - mc-plugins:/plugins
    networks:
      - proxy # accès Internet pour les téléchargements

  # ---------------------------------------------------------------------------
  # Proxy Velocity : point d'entrée unique des joueurs.
  # ---------------------------------------------------------------------------
  velocity:
    build:
      context: ./velocity
      dockerfile: Dockerfile
    image: velocity
    container_name: velocity
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      DOMAIN_NAME: ${DOMAIN_NAME}
      TLD: ${TLD}
      DOMAIN: ${DOMAIN_NAME}${TLD}
      VELOCITY_SECRET: ${VELOCITY_SECRET}
      VELOCITY_MEMORY: ${VELOCITY_MEMORY}
      VELOCITY_ONLINE_MODE: ${VELOCITY_ONLINE_MODE:-true}
      VELOCITY_MOTD: "${VELOCITY_MOTD:-<#09add3>MOTD}"
    volumes:
      - mc-velocity-data:/data
      - mc-plugins:/opt/plugins:ro
    # Bedrock (Geyser) - RakNet UDP 19132, signalisation NetherNet TCP 19132
    # et WebRTC NetherNet UDP 19133.
    ports:
      - "19132:19132/tcp"
      - "19132:19132/udp"
      - "19133:19133/udp"
    networks:
      - proxy     # Traefik + skins Mojang
      - minecraft # serveurs Paper
    depends_on:
      mc-plugins:
        condition: service_completed_successfully
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${PROXY_NETWORK}
      # Routeur TCP : le trafic brut du port 25565 est transmis tel quel.
      traefik.tcp.routers.velocity.rule: "HostSNI(`*`)"
      traefik.tcp.routers.velocity.entrypoints: "minecraft"
      traefik.tcp.routers.velocity.service: "velocity"
      traefik.tcp.services.velocity.loadbalancer.server.port: "25565"

  # ---------------------------------------------------------------------------
  # Serveurs Paper : un conteneur par serveur, port interne 25565.
  # Le plugin déduit son type de SERVER_NAME ; le monde reste sur le volume
  # dédié de chaque serveur.
  # ---------------------------------------------------------------------------
  mc-hub:
    <<: *paper
    container_name: mc-hub
    environment:
      <<: *paper-env
      SERVER_NAME: hub
      DISCORD_BOT_TOKEN: ${MINECRAFT_DISCORD_TOKEN_HUB:-}
      MEMORY: ${MINECRAFT_MEMORY_HUB}
    volumes:
      - mc-hub-data:/data
      - mc-plugin-data:/plugin/DataFolder
      - mc-plugins:/opt/plugins:ro

  mc-survie:
    <<: *paper
    container_name: mc-survie
    environment:
      <<: *paper-env
      SERVER_NAME: survie
      DISCORD_BOT_TOKEN: ${MINECRAFT_DISCORD_TOKEN_SURVIE:-}
      MEMORY: ${MINECRAFT_MEMORY_SURVIE}
    volumes:
      - mc-survie-data:/data
      - mc-plugin-data:/plugin/DataFolder
      - mc-plugins:/opt/plugins:ro

  mc-creatif:
    <<: *paper
    container_name: mc-creatif
    environment:
      <<: *paper-env
      SERVER_NAME: creatif
      DISCORD_BOT_TOKEN: ${MINECRAFT_DISCORD_TOKEN_CREATIF:-}
      MEMORY: ${MINECRAFT_MEMORY_CREATIF}
    volumes:
      - mc-creatif-data:/data
      - mc-plugin-data:/plugin/DataFolder
      - mc-plugins:/opt/plugins:ro

  mc-anarchie:
    <<: *paper
    container_name: mc-anarchie
    environment:
      <<: *paper-env
      SERVER_NAME: anarchie
      DISCORD_BOT_TOKEN: ${MINECRAFT_DISCORD_TOKEN_ANARCHIE:-}
      MEMORY: ${MINECRAFT_MEMORY_ANARCHIE}
    volumes:
      - mc-anarchie-data:/data
      - mc-plugin-data:/plugin/DataFolder
      - mc-plugins:/opt/plugins:ro

  mc-rpg:
    <<: *paper
    container_name: mc-rpg
    environment:
      <<: *paper-env
      SERVER_NAME: rpg
      DISCORD_BOT_TOKEN: ${MINECRAFT_DISCORD_TOKEN_RPG:-}
      MEMORY: ${MINECRAFT_MEMORY_RPG}
    volumes:
      - mc-rpg-data:/data
      - mc-plugin-data:/plugin/DataFolder
      - mc-plugins:/opt/plugins:ro

  mc-skyblock:
    <<: *paper
    container_name: mc-skyblock
    environment:
      <<: *paper-env
      SERVER_NAME: skyblock
      DISCORD_BOT_TOKEN: ${MINECRAFT_DISCORD_TOKEN_SKYBLOCK:-}
      MEMORY: ${MINECRAFT_MEMORY_SKYBLOCK}
    volumes:
      - mc-skyblock-data:/data
      - mc-plugin-data:/plugin/DataFolder
      - mc-plugins:/opt/plugins:ro

  mc-opprison:
    <<: *paper
    container_name: mc-opprison
    environment:
      <<: *paper-env
      SERVER_NAME: opprison
      DISCORD_BOT_TOKEN: ${MINECRAFT_DISCORD_TOKEN_OPPRISON:-}
      MEMORY: ${MINECRAFT_MEMORY_OPPRISON}
    volumes:
      - mc-opprison-data:/data
      - mc-plugin-data:/plugin/DataFolder
      - mc-plugins:/opt/plugins:ro

  mc-test:
    <<: *paper
    container_name: mc-test
    environment:
      <<: *paper-env
      SERVER_NAME: test
      DISCORD_BOT_TOKEN: ${MINECRAFT_DISCORD_TOKEN_TEST:-}
      MEMORY: ${MINECRAFT_MEMORY_TEST}
    volumes:
      - mc-test-data:/data
      - mc-plugin-data:/plugin/DataFolder
      - mc-plugins:/opt/plugins:ro

networks:
  proxy:
    name: ${PROXY_NETWORK}
    external: true
  minecraft:
    name: ${MINECRAFT_NETWORK}
    external: true
  # Sortie Internet uniquement pour les serveurs Paper : le plugin
  # vérifie google.fr/discord.com et Paper récupère les clés Mojang. Aucun
  # port n'est publié sur ce réseau.
  egress:
    name: minecraft_egress

volumes:
  mc-plugins:
    name: mc-plugins
    labels:
      should.backup: "false"
  # Données partagées du plugin maison (argent, grades, tags, îles).
  # Monté sur /plugin/DataFolder dans chaque serveur Paper.
  mc-plugin-data:
    name: mc-plugin-data
    labels:
      should.backup: "true"
  mc-velocity-data:
    name: mc-velocity-data
    labels:
      should.backup: "true"
  mc-hub-data:
    name: mc-hub-data
    labels:
      should.backup: "true"
  mc-survie-data:
    name: mc-survie-data
    labels:
      should.backup: "true"
  mc-creatif-data:
    name: mc-creatif-data
    labels:
      should.backup: "true"
  mc-anarchie-data:
    name: mc-anarchie-data
    labels:
      should.backup: "true"
  mc-rpg-data:
    name: mc-rpg-data
    labels:
      should.backup: "true"
  mc-skyblock-data:
    name: mc-skyblock-data
    labels:
      should.backup: "true"
  mc-opprison-data:
    name: mc-opprison-data
    labels:
      should.backup: "true"
  mc-test-data:
    name: mc-test-data
    labels:
      should.backup: "true"

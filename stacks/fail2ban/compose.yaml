services:
  fail2ban:
    build:
      context: .
      dockerfile: Dockerfile
    image: fail2ban:1
    container_name: fail2ban
    restart: unless-stopped
    # Nécessaire pour modifier iptables sur l'hôte.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: ${TZ}
    volumes:
      - traefik-logs:/var/log/traefik
      - fail2ban-data:/var/lib/fail2ban

volumes:
  traefik-logs:
    name: traefik-logs
  fail2ban-data:
    name: fail2ban-data
    labels:
      should.backup: "false"

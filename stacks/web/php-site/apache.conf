<VirtualHost *:80>
    ServerName php-site
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Route all non-file/non-directory requests to index.php
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Script d'initialisation du site : uniquement utilisable en CLI par
    # l'entrypoint, jamais exposé sur le web.
    <Files "create-db.php">
        Require all denied
    </Files>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>

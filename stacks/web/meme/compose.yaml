name: altherneum

services:
  meme:
    build:
      context: .
      dockerfile: Dockerfile
    image: altherneum/meme:1
    container_name: meme
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${PROXY_NETWORK}
      traefik.http.routers.meme.rule: "Host(`meme.${DOMAIN_NAME}.${TLD}`) || Host(`windows.${DOMAIN_NAME}.${TLD}`) || Host(`microsoft.${DOMAIN_NAME}.${TLD}`) || Host(`arch.${DOMAIN_NAME}.${TLD}`) || Host(`linux.${DOMAIN_NAME}.${TLD}`)"
      traefik.http.routers.meme.entrypoints: "websecure"
      traefik.http.routers.meme.tls.certResolver: "letsencrypt"
      traefik.http.routers.meme.middlewares: "secure-headers@file"
      traefik.http.services.meme.loadbalancer.server.port: "80"

networks:
  proxy:
    name: ${PROXY_NETWORK}
    external: true

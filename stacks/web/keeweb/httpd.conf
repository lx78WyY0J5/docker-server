ServerRoot "/usr/local/apache2"
Listen 80

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
LoadModule headers_module modules/mod_headers.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule unixd_module modules/mod_unixd.so

User www-data
Group www-data

ServerName keeweb
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 300
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /proc/self/fd/1 common

TypesConfig conf/mime.types
AddType application/wasm .wasm
DavLockDB /tmp/DavLock
DirectoryIndex index.html
DocumentRoot "/usr/local/apache2/htdocs"

<Directory "/usr/local/apache2/htdocs">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    AuthType Basic
    AuthName "KeeWeb"
    AuthUserFile "/usr/local/apache2/auth/keeweb.htpasswd"
    Require valid-user
</Directory>

# WebDAV : stockage des fichiers .kdbx
Alias /webdav "/var/www/webdav"
<Directory "/var/www/webdav">
    Dav On
    Options Indexes
    AllowOverride None

    AuthType Basic
    AuthName "WebDAV"
    AuthUserFile "/usr/local/apache2/auth/webdav.htpasswd"
    <LimitExcept OPTIONS>
        Require valid-user
    </LimitExcept>

    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, HEAD, POST, PUT, OPTIONS, MOVE, DELETE, COPY, LOCK, UNLOCK"
    Header always set Access-Control-Allow-Headers "origin, content-type, cache-control, accept, authorization, if-match, destination, overwrite"
    Header always set Access-Control-Allow-Credentials "true"
    Header always set Access-Control-Expose-Headers "ETag"
</Directory>

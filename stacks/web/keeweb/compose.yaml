name: altherneum

services:
  keeweb:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        KEEWEB_VERSION: "1.18.7"
    image: altherneum/keeweb:1.18.7
    container_name: keeweb
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      DOMAIN_NAME: ${DOMAIN_NAME}.${TLD}
    volumes:
      - ./auth:/usr/local/apache2/auth:ro
      - altherneum_keeweb-webdav:/var/www/webdav
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${PROXY_NETWORK}
      traefik.http.routers.keeweb.rule: "Host(`keeweb.${DOMAIN_NAME}.${TLD}`) || Host(`keepass.${DOMAIN_NAME}.${TLD}`) || Host(`keys.${DOMAIN_NAME}.${TLD}`) || Host(`key.${DOMAIN_NAME}.${TLD}`)"
      traefik.http.routers.keeweb.entrypoints: "websecure"
      traefik.http.routers.keeweb.tls.certResolver: "letsencrypt"
      traefik.http.routers.keeweb.middlewares: "secure-headers@file"
      traefik.http.services.keeweb.loadbalancer.server.port: "80"

networks:
  proxy:
    name: ${PROXY_NETWORK}
    external: true

volumes:
  altherneum_keeweb-webdav:
    name: altherneum_keeweb-webdav
    labels:
      com.altherneum.backup: "true"

services:
  azuriom:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AZURIOM_VERSION: ${AZURIOM_VERSION}
        AZURIOM_SHOP_VERSION: ${AZURIOM_SHOP_VERSION:-1.2.26}
        AZURIOM_PRISM_VERSION: ${AZURIOM_PRISM_VERSION:-1.1.0}
    image: azuriom:${AZURIOM_VERSION}
    container_name: azuriom
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      APP_URL: "https://minecraft.${DOMAIN_NAME}${TLD}"
      DOMAIN: ${DOMAIN_NAME}${TLD}
      APP_KEY: ${AZURIOM_APP_KEY}
      AZURIOM_GAME: ${AZURIOM_GAME:-mc-online}
      AZURIOM_ADMIN_GAME_ID: ${AZURIOM_ADMIN_GAME_ID:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      # Chiffré par le seed avec APP_KEY puis stocké dans `servers.data`.
      MINECRAFT_RCON_PASSWORD: ${MINECRAFT_RCON_PASSWORD}
      DB_HOST: db-azuriom
      DB_PORT: "3306"
      DB_DATABASE: ${AZURIOM_DB_NAME}
      DB_USERNAME: ${AZURIOM_DB_USER}
      DB_PASSWORD: ${AZURIOM_DB_PASSWORD}
      AZURIOM_ADMIN_NAME: ${AZURIOM_ADMIN_NAME}
      AZURIOM_ADMIN_EMAIL: ${AZURIOM_ADMIN_EMAIL}
      AZURIOM_ADMIN_PASSWORD: ${AZURIOM_ADMIN_PASSWORD}
      AZURIOM_RESOURCE_PACK_URL: ${AZURIOM_RESOURCE_PACK_URL}
      MAIL_MAILER: ${AZURIOM_MAIL_MAILER}
      MAIL_HOST: ${AZURIOM_MAIL_HOST}
      MAIL_PORT: ${AZURIOM_MAIL_PORT}
      MAIL_USERNAME: ${AZURIOM_MAIL_USERNAME}
      MAIL_PASSWORD: ${AZURIOM_MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${AZURIOM_MAIL_ENCRYPTION}
      MAIL_FROM_ADDRESS: ${AZURIOM_MAIL_FROM_ADDRESS}
    volumes:
      - azuriom-storage:/var/www/html/storage
      - azuriom-plugins:/var/www/html/plugins
      - azuriom-themes:/var/www/html/resources/themes
      - azuriom-config:/var/www/config
    networks:
      - proxy
      - azuriom_internal
      - minecraft
    depends_on:
      db-azuriom:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${PROXY_NETWORK}
      traefik.http.routers.azuriom.rule: "Host(`minecraft.${DOMAIN_NAME}${TLD}`)"
      traefik.http.routers.azuriom.entrypoints: "websecure"
      traefik.http.routers.azuriom.tls.certResolver: "letsencrypt"
      traefik.http.routers.azuriom.middlewares: "secure-headers@file"
      traefik.http.services.azuriom.loadbalancer.server.port: "80"

  db-azuriom:
    image: mariadb:11.8
    container_name: db-azuriom
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      MARIADB_ROOT_PASSWORD: ${AZURIOM_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${AZURIOM_DB_NAME}
      MARIADB_USER: ${AZURIOM_DB_USER}
      MARIADB_PASSWORD: ${AZURIOM_DB_PASSWORD}
    volumes:
      - db-azuriom:/var/lib/mysql
    networks:
      - azuriom_internal
      - db_admin
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  proxy:
    name: ${PROXY_NETWORK}
    external: true
  azuriom_internal:
    name: azuriom_internal
    internal: true
  db_admin:
    name: ${DB_ADMIN_NETWORK}
    external: true
  minecraft:
    name: ${MINECRAFT_NETWORK}
    external: true

volumes:
  azuriom-storage:
    name: azuriom-storage
    labels:
      should.backup: "true"
  azuriom-plugins:
    name: azuriom-plugins
    labels:
      should.backup: "true"
  azuriom-themes:
    name: azuriom-themes
    labels:
      should.backup: "true"
  azuriom-config:
    name: azuriom-config
    labels:
      should.backup: "true"
  db-azuriom:
    name: db-azuriom
    labels:
      should.backup: "true"

services:
  phpmyadmin:
    build:
      context: .
      dockerfile: Dockerfile
    image: phpmyadmin:5.2.3
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PMA_HOSTS: ${PMA_HOSTS}
      PMA_PORT: "3306"
      PMA_ABSOLUTE_URI: "https://phpmyadmin.${DOMAIN_NAME}${TLD}/"
      PMA_BLOWFISH_SECRET: ${PMA_BLOWFISH_SECRET}
      UPLOAD_LIMIT: 64M
    networks:
      - proxy
      - db_admin
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${PROXY_NETWORK}
      traefik.http.routers.phpmyadmin.rule: "Host(`phpmyadmin.${DOMAIN_NAME}${TLD}`)"
      traefik.http.routers.phpmyadmin.entrypoints: "websecure"
      traefik.http.routers.phpmyadmin.tls.certResolver: "letsencrypt"
      traefik.http.routers.phpmyadmin.middlewares: "phpmyadmin-auth@file,secure-headers@file"
      traefik.services.phpmyadmin.loadbalancer.server.port: "80"

networks:
  proxy:
    name: ${PROXY_NETWORK}
    external: true
  db_admin:
    name: ${DB_ADMIN_NETWORK}
    external: true

; Réglages PHP communs. Le fuseau horaire est réécrit au démarrage
; dans /etc/php/conf.d/99-timezone.ini à partir de TZ.
expose_php = Off
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
max_input_time = 120
date.timezone = Europe/Paris

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

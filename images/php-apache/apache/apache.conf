# Réglages globaux communs aux applications PHP.
# Chaque application fournit son propre VirtualHost et son DocumentRoot.

ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 120
KeepAlive On
MaxKeepAliveRequests 100

# Journaux vers stdout/stderr, collectés par Docker.
ErrorLog /dev/stderr
CustomLog /dev/stdout combined
LogLevel warn

# Derrière Traefik : restaurer l'IP cliente.
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 10.0.0.0/8
RemoteIPTrustedProxy 172.16.0.0/12
RemoteIPTrustedProxy 192.168.0.0/16

# En-têtes de sécurité de base. HSTS est géré par Traefik.
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
</IfModule>

DirectoryIndex index.php index.html
